name: Test

on:
  push:
    branches: [2.0.x]
  pull_request:
    branches: [2.0.x]
  workflow_dispatch: {}

env:
  LAUNCH_URL: http://localhost:4321

jobs:
  webship-js:
    name: webship-js cucumber suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Build the demo site
        working-directory: demo
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Serve the production build
        working-directory: demo
        run: |
          nohup npx astro preview --port 4321 --host 0.0.0.0 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null "$LAUNCH_URL/" && exit 0
            sleep 1
          done
          echo "astro preview did not become ready in time" >&2
          cat /tmp/astro-preview.log >&2
          exit 1

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Check that every feature step is defined once
        run: npx cucumber-js --config cucumber.js --dry-run --format summary

      - name: Run webship-js tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: tests/reports/
          retention-days: 14
